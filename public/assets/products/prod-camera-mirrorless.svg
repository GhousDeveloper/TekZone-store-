<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
      <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#F8FAFC"/>
        </radialGradient>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="50%" stop-color="#1E293B"/>
          <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <radialGradient id="lensGlass" cx="40%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
          <stop offset="35%" stop-color="#1E1B4B"/>
          <stop offset="75%" stop-color="#090D16"/>
          <stop offset="100%" stop-color="#020617"/>
        </radialGradient>
      </defs>
      <rect width="400" height="320" fill="url(#bg)"/>
      <ellipse cx="200" cy="272" rx="125" ry="14" fill="rgba(15,23,42,0.14)"/>
      <!-- Top viewfinder hump -->
      <path d="M145 72 L235 72 L248 100 L132 100 Z" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Dials -->
      <rect x="255" y="82" width="32" height="16" rx="3" fill="#475569"/>
      <rect x="295" y="86" width="22" height="12" rx="2" fill="#E11D48"/>
      <rect x="100" y="84" width="26" height="14" rx="2" fill="#64748B"/>
      <!-- Main camera body -->
      <rect x="85" y="96" width="230" height="162" rx="18" fill="url(#bodyGrad)" stroke="#475569" stroke-width="2"/>
      <!-- Grip texture -->
      <rect x="85" y="106" width="52" height="145" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <!-- Red alpha badge -->
      <rect x="275" y="114" width="8" height="22" rx="2" fill="#E11D48"/>
      <!-- Outer lens mount ring -->
      <circle cx="205" cy="182" r="72" fill="#94A3B8"/>
      <circle cx="205" cy="182" r="68" fill="#1E293B"/>
      <circle cx="205" cy="182" r="60" fill="#0F172A" stroke="#E11D48" stroke-width="2"/>
      <!-- Lens glass -->
      <circle cx="205" cy="182" r="48" fill="url(#lensGlass)"/>
      <circle cx="205" cy="182" r="24" fill="#020617" opacity="0.8"/>
      <ellipse cx="188" cy="164" rx="16" ry="9" transform="rotate(-30 188 164)" fill="rgba(255,255,255,0.45)"/>
      <circle cx="222" cy="198" r="5" fill="rgba(56,189,248,0.5)"/>
    </svg>